<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生資料查詢系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 20px; }
    .hidden-block { display: none; }
    .container { max-width: 600px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="container bg-white p-4 rounded shadow-sm">
    <h3 class="text-center mb-4">學生資料查詢系統</h3>
    
    <div class="mb-4 text-center search-buttons">
      <div class="btn-group flex-wrap" role="group">
        <button type="button" class="btn btn-outline-primary active" id="btn-id" onclick="setSearchType('id')">◎ 學生學號</button>
        <button type="button" class="btn btn-outline-primary" id="btn-seat" onclick="setSearchType('seat')">◎ 班級+座號</button>
        <button type="button" class="btn btn-outline-primary" id="btn-class" onclick="setSearchType('class')">◎ 整班查詢</button>
        <button type="button" class="btn btn-outline-primary" id="btn-name" onclick="setSearchType('name')">◎ 班級+姓名</button>
        <button type="button" class="btn btn-outline-primary" id="btn-onlyname" onclick="setSearchType('onlyname')">◎ 僅輸入姓名</button>
      </div>
    </div>

    <form id="searchForm" onsubmit="handleSearch(event)">
      <!-- 模式 1: 學號查詢 -->
      <div id="block-id">
        <label class="form-label text-secondary small">請輸入學號</label>
        <input type="text" class="form-control mb-3" id="val-id" placeholder="例: 10150000">
      </div>

      <!-- 模式 2: 班級+座號 -->
      <div id="block-seat" class="hidden-block">
        <label class="form-label text-secondary small">請輸入班級與座號</label>
        <div class="row mb-3">
          <div class="col">
            <input type="text" class="form-control" id="val-seat-class" placeholder="班級 (例: 701)">
          </div>
          <div class="col">
            <input type="text" class="form-control" id="val-seat-no" placeholder="座號 (例: 5)">
          </div>
        </div>
      </div>

      <!-- 模式 3: 整班查詢 -->
      <div id="block-class" class="hidden-block">
        <label class="form-label text-secondary small">請輸入班級</label>
        <input type="text" class="form-control mb-3" id="val-class-only" placeholder="班級 (例: 701)">
      </div>
      
      <!-- 模式 4: 班級+姓名 -->
      <div id="block-name" class="hidden-block">
        <label class="form-label text-secondary small">請輸入班級與姓名</label>
        <div class="row mb-3">
          <div class="col"><input type="text" class="form-control" id="val-name-class" placeholder="班級"></div>
          <div class="col"><input type="text" class="form-control" id="val-name-text" placeholder="姓名"></div>
        </div>
      </div>

      <!-- 模式 5: 僅輸入姓名 -->
      <div id="block-onlyname" class="hidden-block">
        <label class="form-label text-secondary small">請輸入姓名</label>
        <input type="text" class="form-control mb-3" id="val-onlyname" placeholder="姓名">
      </div>

      <button type="submit" class="btn btn-primary w-100" id="submitBtn">查詢</button>
    </form>

    <!-- 查詢結果顯示區 -->
    <div id="resultArea" class="mt-4"></div>
  </div>

  <script>
    // 替換為你在 Google Apps Script 部署為「網頁應用程式」後取得的 URL
    const GAS_API_URL = 'https://script.google.com/a/macros/thjh.tp.edu.tw/s/AKfycbytJzfqMWaTdmnehCNa_qvGHtpAHNxpUP-h-anPda-xCxG8U-eQF8l_KupakB7kQ_cb/exec;
    let currentSearchType = 'id';

    function setSearchType(type) {
      currentSearchType = type;
      
      // 重置按鈕狀態
      document.querySelectorAll('.search-buttons .btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + type).classList.add('active');
      
      // 隱藏所有區塊
      const blocks = ['block-id', 'block-seat', 'block-class', 'block-name', 'block-onlyname'];
      blocks.forEach(block => document.getElementById(block).classList.add('hidden-block'));
      
      // 顯示目標區塊
      document.getElementById('block-' + type).classList.remove('hidden-block');
    }

    async function handleSearch(event) {
      event.preventDefault();
      
      // 1. 收集表單資料
      let payload = { type: currentSearchType };
      
      if (currentSearchType === 'id') payload.id = document.getElementById('val-id').value;
      if (currentSearchType === 'seat') {
        payload.class = document.getElementById('val-seat-class').value;
        payload.seat = document.getElementById('val-seat-no').value;
      }
      if (currentSearchType === 'class') payload.class = document.getElementById('val-class-only').value;
      if (currentSearchType === 'name') {
        payload.class = document.getElementById('val-name-class').value;
        payload.name = document.getElementById('val-name-text').value;
      }
      if (currentSearchType === 'onlyname') payload.name = document.getElementById('val-onlyname').value;

      // 2. 顯示載入中
      const btn = document.getElementById('submitBtn');
      const resultArea = document.getElementById('resultArea');
      btn.disabled = true;
      btn.innerText = '查詢中...';
      resultArea.innerHTML = '';

      // 3. 發送 Fetch 請求至 GAS
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          // 使用 text/plain 避免觸發 GAS 無法處理的 CORS Preflight (OPTIONS) 請求
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        
        const data = await response.json();
        
        // 4. 渲染結果 (請依據你的回傳資料結構修改)
        if(data && data.success) {
          resultArea.innerHTML = `<div class="alert alert-success">${JSON.stringify(data.result)}</div>`;
        } else {
          resultArea.innerHTML = `<div class="alert alert-warning">查無結果</div>`;
        }
      } catch (error) {
        console.error('Error:', error);
        resultArea.innerHTML = `<div class="alert alert-danger">連線發生錯誤，請稍後再試。</div>`;
      } finally {
        btn.disabled = false;
        btn.innerText = '查詢';
      }
    }
  </script>
</body>
</html>
